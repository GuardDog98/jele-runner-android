<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#061028"/>
      <stop offset="1" stop-color="#0b2744"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#2ad0ff"/>
      <stop offset="1" stop-color="#7ef6d7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- stylized horizon / city shapes -->
  <g opacity="0.45">
    <path d="M0 520 C120 460 260 420 420 430 C560 438 680 490 840 480 C980 472 1120 400 1200 360 L1200 675 L0 675 Z" fill="#071a2b" />
    <path d="M0 560 C160 520 320 500 480 500 C640 500 800 520 960 510 C1080 502 1200 480 1200 480 L1200 675 L0 675 Z" fill="#0b2b3f" />
  </g>

  <!-- neon road perspective -->
  <g transform="translate(0,120)">
    <path d="M300 90 L600 0 L900 90 L900 520 L300 520 Z" fill="#081827" opacity="0.9"/>
    <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
      <line x1="450" y1="120" x2="750" y2="450" />
      <line x1="500" y1="140" x2="760" y2="470" />
    </g>

    <!-- center lane glow -->
    <path d="M600 12 L775 480 L425 480 Z" fill="url(#neon)" opacity="0.08" filter="url(#glow)"/>
  </g>

  <!-- runner (stylized block) -->
  <g transform="translate(560,360)">
    <rect x="-22" y="-44" width="44" height="44" rx="8" ry="8" fill="url(#neon)" filter="url(#glow)" />
    <rect x="-14" y="-62" width="28" height="18" rx="6" ry="6" fill="#042338" opacity="0.12" />
    <circle cx="-6" cy="-20" r="4" fill="#051b2e" opacity="0.14" />
  </g>

  <!-- coins -->
  <g fill="#ffd971" stroke="#ffb84d" stroke-width="1" filter="url(#glow)">
    <ellipse cx="480" cy="250" rx="14" ry="10" />
    <ellipse cx="660" cy="200" rx="14" ry="10" />
    <ellipse cx="720" cy="330" rx="14" ry="10" />
  </g>

  <!-- obstacle -->
  <g transform="translate(720,410)">
    <rect x="-16" y="-16" width="32" height="32" rx="5" fill="#ff6b9a" stroke="#ff4f90" stroke-width="1" filter="url(#glow)"/>
  </g>

  <!-- title / badges -->
  <g transform="translate(48,48)">
    <text x="0" y="0" font-family="Orbitron, sans-serif" font-size="40" fill="#dff9ff">Jele Runner</text>
    <text x="0" y="44" font-family="Inter, sans-serif" font-size="16" fill="#a9cbdc">Android 3D runner • Kotlin + OpenGL ES</text>

    <rect x="0" y="70" width="260" height="38" rx="8" fill="#051b2e" opacity="0.6" />
    <text x="18" y="96" font-family="Inter, sans-serif" font-size="14" fill="#9fe6ff">Playable prototype on GitHub</text>
  </g>

  <!-- AI badge -->
  <g transform="translate(1020,34)">
    <rect x="0" y="0" width="150" height="42" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
    <text x="18" y="26" font-family="Inter, sans-serif" font-size="14" fill="#7ef6d7">AI-enhanced image</text>
  </g>

  <!-- footer text -->
  <g transform="translate(48,600)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="12" fill="#7fadc6">Generated art-style poster for Jele Runner — replace with an actual GIF or video anytime.</text>
  </g>
</svg>
